<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planificacion CF — Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="theme-color" content="#0ea5e9" />
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="border-b">
    <div class="container py-4 sm:py-6 flex items-center justify-between">
      <div class="flex items-center gap-2 sm:gap-3">
        <img src="logo.png" alt="Logo CF" class="logo">
        <div>
          <h1 class="title text-lg sm:text-xl lg:text-2xl">Planificacion CF — Admin</h1>
          <p id="currentMonth" class="subtitle text-sm"></p>
        </div>
      </div>
      <div class="flex items-center gap-2 sm:gap-3">
        <a href="index.html" class="btn-secondary text-sm sm:text-base">
          <span class="hidden sm:inline">Ver público</span>
          <span class="sm:hidden">Público</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container space-y-6 pb-16 pt-6">
    <section class="card space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="section-title">Editor de Planificaciones</h2>
      </div>

      <!-- Selección de Categoría -->
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3">
        <label class="label min-w-fit">Categoría:</label>
        <select id="categorySelect" class="input w-full sm:max-w-xs">
          <option value="">— Seleccionar —</option>
          <option value="clase-crossfit">Clase CrossFit</option>
          <option value="crossfit-atletas">CrossFit Atletas</option>
          <option value="musculacion">Musculación</option>
        </select>
      </div>

      <!-- Selección de Subcategoría (solo para musculación) -->
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3" id="subcategoryContainer" style="display: none;">
        <label class="label min-w-fit">Subcategoría:</label>
        <select id="subcategorySelect" class="input w-full sm:max-w-xs">
          <option value="">— Seleccionar —</option>
          <option value="hipertrofia hombres">Hipertrofia Hombres</option>
          <option value="hipertrofia mujeres">Hipertrofia Mujeres</option>
          <option value="adaptacion">Adaptación</option>
          <option value="full body">Full Body</option>
          <option value="piernas y glúteos">Piernas y Glúteos</option>
          <option value="cardio y zona media">Cardio y Zona Media</option>
        </select>
      </div>

      <!-- Selección de Nivel (solo para musculación) -->
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3" id="levelContainer" style="display: none;">
        <label class="label min-w-fit">Nivel:</label>
        <select id="levelSelect" class="input w-full sm:max-w-xs">
          <option value="">— Seleccionar —</option>
          <option value="nivel1">Nivel 1 - Principiante</option>
          <option value="nivel2">Nivel 2 - Intermedio</option>
          <option value="nivel3">Nivel 3 - Avanzado</option>
        </select>
      </div>

      <!-- Elegí el día -->
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3">
        <label class="label min-w-fit">Elegí un día:</label>
        <select id="daySelect" class="input w-full sm:max-w-xs">
          <option value="">— Seleccionar —</option>
          <option value="monday">Lunes</option>
          <option value="tuesday">Martes</option>
          <option value="wednesday">Miércoles</option>
          <option value="thursday">Jueves</option>
          <option value="friday">Viernes</option>
          <option value="saturday">Sábado</option>
        </select>
      </div>

      <!-- Tabs de días -->
      <div class="flex gap-2 flex-wrap" id="tabs"></div>

      <p class="muted">
        Editando: <b id="categoryLabel">—</b> - <b id="dayLabel">—</b>
        <span id="subcategoryLabel" style="display: none;"> (<b id="subcategoryText">—</b></span>
        <span id="levelLabel" style="display: none;"> - <b id="levelText">—</b></span>
        <span id="subcategoryLabel" style="display: none;">)</span>
      </p>
      <input type="hidden" id="dayKey" value="" />
      <input type="hidden" id="currentCategory" value="" />
      <input type="hidden" id="currentSubcategory" value="" />
      <input type="hidden" id="currentLevel" value="" />

      <textarea id="planTextarea" rows="12" class="textarea" placeholder="Elegí un día para empezar a escribir..." disabled></textarea>

      <div class="flex justify-end gap-2">
        <button id="saveBtn" class="btn-success" disabled>Guardar planificación</button>
      </div>
      <p class="muted"></p>
    </section>
  </main>

  <footer class="border-t mt-8">
    <div class="container mx-auto py-6 px-4 flex flex-col sm:flex-row justify-between items-center text-center sm:text-left">
      <!-- Marca del Gym o la App -->
      <div>
        <h2 class="font-bold text-sky-600 text-lg">Planificación CF</h2>
        <p class="text-slate-500 text-sm">© 2025 Tu Empresa Fitness. Todos los derechos reservados.</p>
      </div>

      <!-- Datos  -->
      <div class="mt-4 sm:mt-0">
        <p class="text-slate-500 text-sm">
          Desarrollado por 
          <a href="https://tusitio.com" target="_blank" rel="noopener" class="text-sky-600 hover:underline">
            ZonaTech
          </a>
        </p>
        <p class="text-slate-500 text-sm">📧 zonazeroale10@gmail.com | 📱 +54 9 351 5168272</p>
      </div>
    </div>
  </footer>

  <script type="module" src="app-admin.js"></script>
</body>
</html>
